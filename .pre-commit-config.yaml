repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: npx --prefix src/frontend oxfmt --config src/frontend/.oxfmtrc.json
        language: system
        types_or: [javascript, jsx, ts, tsx, css, json]
        files: ^src/frontend/
        exclude: package-lock\.json

      - id: i18n-check
        name: i18n catalogs (every t() string translated, en.json in sync)
        entry: npx --prefix src/frontend vitest run src/tests/i18n.test.ts
        language: system
        files: ^(src/frontend/src|shelfmark)/
        pass_filenames: false
